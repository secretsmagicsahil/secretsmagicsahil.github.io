<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Heist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <div class="card" id="playerView">
    <h1>🕵️ Join the Heist</h1>

    <section id="joinSection">
      <label for="playerName">Your name (or codename):</label>
      <input id="playerName" type="text" placeholder="e.g. The Phantom">
      <button class="btn" id="joinBtn">Join Game</button>
    </section>

    <section id="gameSection" class="hidden">
      <p>Welcome, <strong><span id="displayName"></span></strong>!</p>
      <p id="playerTeamText" class="live-box">You are in a secret team. Waiting for assignment...</p>
      <p><strong>Current Phase:</strong> <span id="playerPhaseText">–</span></p>
      <h2>Mission</h2>
      <p id="playerMissionText" class="live-box">Waiting for mission...</p>

      <div class="card">
        <h2>Global Chat</h2>
      
        <p class="label">Current shared message:</p>
        <div id="playerBoardDisplay" class="message-box">
          Waiting for message…
        </div>
      
        <p class="label" style="margin-top: 8px;">Edit the shared message:</p>
        <textarea id="playerBoardInput"
                  placeholder="Type something for everyone to see..."></textarea>
        <button id="playerBoardSaveBtn">Save message</button>
      </div>
    </section>

  </div>

  <!-- Firebase + app logic -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="app.js"></script>
</body>
</html>
